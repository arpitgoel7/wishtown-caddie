}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 2px 0 0; text-wrap: balance; }

.holefacts { display: flex; gap: 18px; flex-wrap: wrap; }
.fact { display: grid; }
.fact b { font-family: var(--display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; padding: 6px 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
.main { display: grid; grid-template-columns: minmax(260px, 400px) minmax(0, 1fr); gap: 24px; align-items: start; }

.mapcard { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; }
@media (max-width: 820px) { .mapcard { position: static; } }
.mapbox { display: flex; justify-content: center; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }

.credit { font-size: 11px; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: inherit; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .02em; padding: 8px 12px; border: 0; background: none; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { display: grid; gap: 16px; padding-top: 16px; min-width: 0; }
.note { font-size: 13px; color: var(--muted); }
.banner { background: var(--soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }

.hz b { font-weight: 600; }

.busy { position: relative; }
.busy::after { content: "Working out your best route…"; position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; background: color-mix(in srgb, var(--bg) 70%, transparent); font-weight: 600; border-radius: var(--r); }
.src { font-size: 12px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch; }

.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

<script id="engine-src">// ===== Hole-strategy engine (coordinates in yards: x = right of tee line, y = toward green) =====
const LIE = { R: 0, F: 1, G: 2, S: 3, W: 4, T: 5, OB: 6 };
const LIE_NAME = ['rough', 'fairway', 'green', 'bunker', 'water', 'trees', 'out of bounds'];

function pip(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---- Lie raster (1 yd) ----
const RX0 = -110, RX1 = 120, RY0 = -25, RY1 = 375, RW = RX1 - RX0 + 1, RH = RY1 - RY0 + 1;
function buildRaster(hole) {
  const r = new Uint8Array(RW * RH);
  for (let j = 0; j < RH; j++) {
    const y = RY0 + j;
    for (let i = 0; i < RW; i++) {
      const x = RX0 + i;
      let l = LIE.R;
      for (const f of hole.features) if (pip(x, y, f.poly)) { l = f.lie; break; }
      r[j * RW + i] = l;
    }
  }
  return r;
}
function lieAt(H, x, y) {
  const i = Math.round(x) - RX0, j = Math.round(y) - RY0;
  if (i < 0 || j < 0 || i >= RW || j >= RH) return LIE.T;
  return H.raster[j * RW + i];
}

// ---- Short game & putting baselines (scratch values, then handicap add-on) ----
const PUTT = [[1, 1.0], [2, 1.01], [3, 1.04], [4, 1.13], [5, 1.23], [6, 1.34], [8, 1.5], [10, 1.61], [15, 1.78], [20, 1.87], [30, 1.98], [40, 2.06], [50, 2.14], [60, 2.21], [90, 2.4], [120, 2.55]];
const SGT = {
  [LIE.F]: [[0, 2.05], [5, 2.1], [10, 2.18], [20, 2.4], [30, 2.52], [40, 2.6], [50, 2.66]],
  [LIE.R]: [[0, 2.2], [5, 2.25], [10, 2.34], [20, 2.59], [30, 2.7], [40, 2.78], [50, 2.87]],
  [LIE.S]: [[0, 2.3], [5, 2.35], [10, 2.43], [20, 2.53], [30, 2.66], [40, 2.82], [50, 2.92]],
};
const SG_ADD = { [LIE.F]: 0.02, [LIE.R]: 0.025, [LIE.S]: 0.035 };
function interp(t, v) {
  if (v <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (v <= t[i][0]) {
    const [a, fa] = t[i - 1], [b, fb] = t[i];
    return fa + ((fb - fa) * (v - a)) / (b - a);
  }
  return t[t.length - 1][1];
}
function puttE(ft, h) { return Math.max(1, interp(PUTT, ft) + h * (0.004 + 0.00008 * Math.min(ft, 90))); }
function sgE(d, lie, h) {
  const L = lie === LIE.T ? LIE.R : (lie === LIE.G ? LIE.F : lie);
  return interp(SGT[L], d) + h * SG_ADD[L] + (lie === LIE.T ? 0.35 : 0);
}
const SG_R = 40; // within this many yards of the pin (off the green) use short-game baseline

// ---- Player model ----

} catch (e) { worker = null; }
const fallback = new Function(document.getElementById('worker-src').textContent + '; return compute;')();

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v) => (v < 0.005 && v > 0 ? '<1' : Math.round(v * 100)) + '%';
const yd = (v) => Math.round(v);
const tee = () => H.tees[cur().tee];
const pin = () => H.pins[S.pin];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const LIECOL = { 0: '#E9F5C9', 1: '#FFFFFF', 2: '#7CFC9A', 3: '#E8C77A', 4: '#FF5A4E', 5: '#FF9F43', 6: '#FF5A4E' };
const strokesFor = (h) => { h = Math.max(0, Math.round(+h || 0)); return Math.floor(h / 18) + ((h % 18) >= H.si ? 1 : 0); };

function fairwayEdges(y) {
  let l = null, r = null;
  for (let x = -80; x <= 80; x++) if (lieAt(H, x, y) === LIE.F) { if (l === null) l = x; r = x; }
  return l === null ? null : [l, r];
}
function describeAim(p) {
  const e = fairwayEdges(p.y);
  if (!e) return p.x < -30 ? 'well left of the fairway' : 'the short grass in front of the green';
  const [l, r] = e, w = r - l;
  if (p.x < l - 2) return `${yd(l - p.x)} yds left of the fairway`;
  if (p.x > r + 2) return `${yd(p.x - r)} yds right of the fairway`;
  const f = (p.x - l) / w;
  return f < 0.2 ? 'the left edge of the fairway' : f < 0.42 ? 'left-centre of the fairway' : f < 0.58 ? 'the centre of the fairway' : f < 0.8 ? 'right-centre of the fairway' : 'the right edge of the fairway';
}
function lineCarry(from, ang, lieCode, maxD) {
  // distance along the line to the far edge of the last stretch of `lieCode`
  let last = 0;
  for (let d = 1; d <= maxD; d++) if (lieAt(H, from.x + Math.sin(ang) * d, from.y + Math.cos(ang) * d) === lieCode) last = d;
  return last;
}

  html += `<div class="plancard">`;
  html += `<div class="shot"><div class="shotno">Tee</div><div>
     <h3>${esc(row.name)}${pick === 0 ? '' : ' <span class="note">(alternative)</span>'}</h3>
     <p>Aim at ${describeAim(aimPt)}, about ${yd(row.total)} yds out.${waterCarry ? ` On this line you need <b>${waterCarry} yds of carry</b> to clear the pond.` : ''}</p>
     <div class="chips">
       <span class="chip"><i style="background:#fff;border:1px solid var(--line)"></i>Fairway ${pct(share(LIE.F))}</span>
       <span class="chip"><i style="background:#C9D98B"></i>Rough ${pct(share(LIE.R))}</span>
       <span class="chip"><i style="background:#FF9F43"></i>Trees ${pct(share(LIE.T))}</span>
       <span class="chip"><i style="background:#E8C77A"></i>Bunker ${pct(share(LIE.S))}</span>
       <span class="chip"><i style="background:#FF5A4E"></i>Water ${pct(share(LIE.W))}</span>
     </div></div></div>`;
  if (sec) {
    if (sec.short) {
      html += `<div class="shot"><div class="shotno">Next</div><div><h3>${sec.lie === LIE.G ? 'Putt' : 'Chip or pitch'}</h3><p>A typical tee shot finishes about ${yd(sec.d)} yds from the pin. ${sec.lie === LIE.G ? 'Two putts for your par.' : 'Get it on the green and two-putt.'}</p></div></div>`;
    } else {
      const off = Math.tan((sec.aimDeg * Math.PI) / 180) * sec.d;
      const aimTxt = Math.abs(off) < 3 ? 'straight at the flag' : `${yd(Math.abs(off))} yds ${off > 0 ? 'right' : 'left'} of the flag`;
      const bunkerCarry = lineCarry(sec, sec.ang, LIE.S, sec.d + 5);
      html += `<div class="shot"><div class="shotno">Shot 2</div><div><h3>${esc(sec.name)}</h3>
        <p>From a typical finish about <b>${yd(sec.d)} yds</b> from the pin (${LIE_NAME[sec.lie]}). Aim ${aimTxt}.${bunkerCarry ? ` The front bunker needs ${bunkerCarry} yds of carry on this line.` : ''}</p>
        <div class="chips"><span class="chip"><i style="background:#7CFC9A"></i>Green ${pct(sec.green)}</span><span class="chip"><i style="background:#E8C77A"></i>Bunker ${pct(sec.sand)}</span>${sec.water > 0.004 ? `<span class="chip"><i style="background:#FF5A4E"></i>Water ${pct(sec.water)}</span>` : ''}</div></div></div>`;
    }
    html += `<div class="shot"><div class="shotno">Then</div><div><p>${R.netPar > 4 ? `You get ${R.strokes} stroke${R.strokes > 1 ? 's' : ''} here, so a ${R.netPar} is net par. A bogey is a good score; don't chase a birdie.` : 'No shot here. Par is the target.'}</p></div></div>`;
  }
  html += `</div>`;
  // distribution
  html += `<div><h2>Likely scores</h2><div class="distbar" style="margin-top:8px">${row.hist.map((v, i) => v > 0.004 ? `<div style="width:${v * 100}%;background:${HCOL[i]}" title="${HLAB[i]} ${pct(v)}">${v > 0.07 ? Math.round(v * 100) + '%' : ''}</div>` : '').join('')}</div>
    <div class="distkey">${row.hist.map((v, i) => v > 0.004 ? `<span><i style="background:${HCOL[i]}"></i>${HLAB[i]} ${pct(v)}</span>` : '').join('')}</div></div>`;
  // why
  const drv = R.rows.find((r) => r.kind === 'driver');
  if (pick === 0 && drv && drv !== best) {
    html += `<p class="why">Driver averages ${drv.mean.toFixed(2)} with ${pct(drv.blow)} blow-up risk${drv.water > 0.01 ? ` and finds water ${pct(drv.water)} of the time` : ''}. ${esc(best.name)} averages ${best.mean.toFixed(2)} with ${pct(best.blow)} blow-up risk. ${S.objective === 'safe' ? 'For playing to your handicap, the safer club wins.' : ''}</p>`;
  } else if (pick === 0 && drv === best) {
    const alt = R.rows[1];
    if (alt) html += `<p class="why">Driver is the right play for your numbers. It leaves a short pitch, and the pond only catches a badly mishit shot (${pct(drv.water)}). Next best is ${esc(alt.name)} at ${alt.mean.toFixed(2)}.</p>`;
  }
  // alternatives
  html += `<div><h2>Tee shot options</h2><p class="note">Each option is simulated 2,500 times through to the hole, using your bag. Tap a row to see it on the map.</p>
   <div class="tablewrap"><table><thead><tr><th>Tee club</th><th>Avg</th><th>Net par+</th><th>Water</th><th>Blow-up</th></tr></thead><tbody>
   ${R.rows.map((r, i) => `<tr class="clickable ${i === 0 ? 'pick' : ''} ${i === pick && i !== 0 ? 'hl' : ''}" data-pick="${i}"><td>${esc(r.name)}${i === 0 ? ' ✓' : ''}</td><td>${r.mean.toFixed(2)}</td><td>${pct(r.npb)}</td><td>${pct(r.water)}</td><td>${pct(r.blow)}</td></tr>`).join('')}
   </tbody></table></div></div>`;
  el.innerHTML = html;
}
$('#panel-plan').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-pick]'); if (tr) { pick = +tr.dataset.pick; renderPlan(); drawMap(); return; }
  const b = e.target.closest('[data-go]'); if (b) { S.tab = b.dataset.go; save(); showTab(); }
});

// ---------- bag panel ----------
let confirmDel = false;
function renderBag() {
  const p = cur(), el = $('#panel-bag');
  el.innerHTML = `<div class="form">
    <div class="row">
      <div class="field"><label for="f-name">Name</label><input id="f-name" value="${esc(p.name)}" style="width:12em"></div>
      <div class="field"><label for="f-hcp">Playing handicap</label><input id="f-hcp" type="number" min="0" max="54" step="1" value="${p.hcp}" style="width:6em"></div>
      <div class="field"><label for="f-g">Plays from</label><select id="f-g"><option value="M" ${p.gender === 'M' ? 'selected' : ''}>Men's tees</option><option value="F" ${p.gender === 'F' ? 'selected' : ''}>Ladies' tees</option></select></div>
      <div class="field"><label for="f-bias">Usual miss</label><select id="f-bias"><option value="L" ${p.bias === 'L' ? 'selected' : ''}>Left (hook/draw)</option><option value="S" ${p.bias === 'S' ? 'selected' : ''}>Both ways</option><option value="R" ${p.bias === 'R' ? 'selected' : ''}>Right (slice/fade)</option></select></div>
      <div class="field"><label for="f-acc">Accuracy as</label><select id="f-acc"><option value="yds" ${p.accMode === 'yds' ? 'selected' : ''}>± yards side miss</option><option value="pct" ${p.accMode === 'pct' ? 'selected' : ''}>% on target</option></select></div>
    </div>
    <p class="note">Carry is where the ball lands; total includes roll. ${p.accMode === 'pct' ? '“% on target” means fairways hit for woods and greens hit from a good lie for irons.' : '“± yds” is how far left or right a normal shot finishes from your aim. Leave it blank and the app estimates it from your handicap.'} Confidence: 1 = avoid this club, 5 = trust it under pressure.</p>
    <div class="bag" id="bag">
      <div class="bagrow head"><span>Club</span><span>Carry</span><span>Total</span><span>${p.accMode === 'pct' ? '% on tgt' : '± yds'}</span><span>Conf.</span><span>Use</span></div>
      ${p.clubs.map((c, i) => `<div class="bagrow ${c.on ? '' : 'off'}" data-i="${i}">
        <input aria-label="Club name" data-k="name" value="${esc(c.name)}">
        <input aria-label="${esc(c.name)} carry" data-k="carry" type="number" inputmode="numeric" value="${c.carry}">
        <input aria-label="${esc(c.name)} total" data-k="total" type="number" inputmode="numeric" value="${c.total}">
        <input aria-label="${esc(c.name)} accuracy" data-k="acc" type="number" inputmode="numeric" placeholder="auto" value="${c.acc}">
        <select aria-label="${esc(c.name)} confidence" data-k="conf">${[1, 2, 3, 4, 5].map((v) => `<option ${+c.conf === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <input aria-label="Use ${esc(c.name)}" data-k="on" type="checkbox" ${c.on ? 'checked' : ''}>
      </div>`).join('')}
    </div>
    <div class="row">
      <button class="btn ghost small" id="addClub">Add club</button>
      <button class="btn ghost small" id="resetBag">Fill typical ${p.hcp}-hcp distances</button>
    </div>
    <div class="row"><button class="btn" id="buildPlan">Build my game plan</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="row">
      <button class="btn ghost small" id="addPlayer">Add teammate</button>
      ${S.players.length > 1 ? (confirmDel ? `<span class="confirm">Delete ${esc(p.name)}? <button class="btn danger small" id="delYes">Delete</button><button class="btn ghost small" id="delNo">Keep</button></span>` : `<button class="btn danger small" id="delPlayer">Delete this player</button>`) : ''}
    </div>
    <p class="note">Players are saved in this browser only. Each teammate can open this page on their own phone and enter their bag.</p>
  </div>`;
}
$('#panel-bag').addEventListener('input', (e) => {
  const p = cur(), t = e.target;
  if (t.id === 'f-name') { p.name = t.value; renderHeaderOnly(); }
  else if (t.id === 'f-hcp') { p.hcp = Math.max(0, Math.min(54, +t.value || 0)); renderHeaderOnly(); }
  else if (t.dataset.k) {
    const i = +t.closest('.bagrow').dataset.i, c = p.clubs[i], k = t.dataset.k;
    if (k === 'on') { c.on = t.checked; t.closest('.bagrow').classList.toggle('off', !c.on); }
    else if (k === 'name') c.name = t.value;
    else if (k === 'acc') c.acc = t.value === '' ? '' : +t.value;
    else c[k] = +t.value;
  } else return;
  p.sample = false; dirty = true; save();
});
$('#panel-bag').addEventListener('change', (e) => {
  const p = cur(), t = e.target;
  if (t.id === 'f-g') { p.gender = t.value; p.tee = t.value === 'F' ? 'Red' : 'Blue'; }
  else if (t.id === 'f-bias') p.bias = t.value;
  else if (t.id === 'f-acc') { p.accMode = t.value; p.clubs.forEach((c) => (c.acc = '')); renderBag(); }
  else return;
  p.sample = false; dirty = true; save(); renderHeader();
});
$('#panel-bag').addEventListener('click', (e) => {
  const p = cur(), id = e.target.id;
  if (id === 'addClub') { p.clubs.push({ name: 'New club', carry: 100, total: 105, acc: '', conf: 3, on: true }); renderBag(); }
  else if (id === 'resetBag') { p.clubs = sampleBag(p.hcp, p.gender); dirty = true; renderBag(); }
  else if (id === 'buildPlan') { S.tab = 'plan'; save(); showTab(); refreshAll(); }
  else if (id === 'addPlayer') { S.players.push(newPlayer('New player', 'M', 18, false)); S.cur = S.players.length - 1; confirmDel = false; refreshAll(); }
  else if (id === 'delPlayer') { confirmDel = true; renderBag(); }
  else if (id === 'delNo') { confirmDel = false; renderBag(); }
  else if (id === 'delYes') { S.players.splice(S.cur, 1); S.cur = 0; confirmDel = false; refreshAll(); }
  else return;
  save();
});
function renderHeaderOnly() { renderHeader(); }

// ---------- hazards panel ----------
const HAZ = [
  { k: 'pond1', name: 'Pond in front of the tee', poly: OSM_GEOM.pond1, col: '#5AA6F0', tip: 'Penalty area. Only a topped or thin tee shot finds it, but from the back tees it sits across the left half of the line.' },
  { k: 'pond2', name: 'Pond right of the fairway', poly: OSM_GEOM.pond2, col: '#5AA6F0', tip: 'Penalty area. It catches long tee shots that leak right.' },
  { k: 'tl', name: 'Trees and cart path, left', poly: H.treesLeft, col: '#2F5A33', tip: 'Usually a punch-out back to the fairway.' },
  { k: 'tc', name: 'Tree clump at the corner, left', poly: H.treesClump, col: '#2F5A33', tip: 'Blocks the left side of the landing area for longer hitters.' },
  { k: 'tr', name: 'Trees between the ponds, right', poly: H.treesRight, col: '#2F5A33', tip: 'Blocks the approach from the right rough.' },
  { k: 'bf', name: 'Front greenside bunker', poly: OSM_GEOM.bunkerFront, col: '#E8C77A', tip: 'Guards the front and centre of the green. Front pins sit right behind it.' },
  { k: 'bb', name: 'Bunker behind the green', poly: OSM_GEOM.bunkerBack, col: '#E8C77A', tip: 'Catches approaches that fly long.' },
  { k: 'br', name: 'Bunker right of the green', poly: OSM_GEOM.bunkerRightGreen, col: '#E8C77A', tip: 'Belongs to the neighbouring green, but in play if you bail out right.' },
  { k: 'g', name: 'Green', poly: OSM_GEOM.green, col: '#7CFC9A', tip: '' },
];
function renderHazards() {
  const t = tee(), pn = pin();
  const base = Math.atan2(pn.x - t.x, pn.y - t.y);
  const rows = HAZ.map((h) => {
    let mn = 1e9, mx = 0, sx = 0, sy = 0;
    for (const [x, y] of h.poly) { const d = Math.hypot(x - t.x, y - t.y); mn = Math.min(mn, d); mx = Math.max(mx, d); sx += x; sy += y; }
    const cx = sx / h.poly.length, cy = sy / h.poly.length;
    const lat = (cx - t.x) * Math.cos(base) - (cy - t.y) * Math.sin(base);
    return { ...h, mn, mx, lat };
  });
  const g = rows.find((r) => r.k === 'g');
  $('#panel-hz').innerHTML = `<p class="note">Distances from the ${cur().tee} tee, measured off the satellite outlines. “Reach” is the distance to the near edge and “carry” is the distance to clear the far edge.</p>
   <div class="plancard">${rows.filter((r) => r.k !== 'g').map((r) => `<div class="hz"><i style="background:${r.col}"></i>
     <div><b>${r.name}</b><div class="note">${Math.abs(r.lat) < 8 ? 'On the line' : `${yd(Math.abs(r.lat))} yds ${r.lat > 0 ? 'right' : 'left'} of the line to the pin`}. ${r.tip}</div></div>
     <div class="yd">${yd(r.mn)}–${yd(r.mx)}<small>reach – carry</small></div></div>`).join('')}
   <div class="hz"><i style="background:#7CFC9A"></i><div><b>Green</b><div class="note">About ${yd(g.mx - g.mn)} yds deep and 37 yds wide. Front ${yd(g.mn)}, back ${yd(g.mx)}.</div></div><div class="yd">${yd(dist(t, pn))}<small>to the ${S.pin.toLowerCase()} pin</small></div></div>
   </div>
   <p class="note">Out of bounds: the houses down the left, beyond the trees past about 150 yds. Tee yardages follow the official card. The GPS distance from the back of the tee box to the centre of the green is about 306.</p>`;
}

// ---------- scorecard panel ----------
function renderCard() {
  const r = SCORECARD.holes;
  const tot = (a, b) => r.slice(a, b).reduce((s, h) => [s[0] + h.par, s[1] + h.y[0], s[2] + h.y[1], s[3] + h.y[2], s[4] + h.y[3]], [0, 0, 0, 0, 0]);
  const line = (lab, t) => `<tr class="sum"><td>${lab}</td><td>${t[0]}</td><td></td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`;
  const hr = (h, i) => `<tr class="${i === 3 ? 'pick' : ''}"><td>${i + 1}</td><td>${h.par}</td><td>${h.si}</td><td>${h.y[0]}</td><td>${h.y[1]}</td><td>${h.y[2]}</td><td>${h.y[3]}</td></tr>`;
  $('#panel-card').innerHTML = `<p class="note">The current par-71 card, in yards. Men play Black or Blue; ladies play White or Red. Stroke indexes are the same for men and ladies.</p>
  <div class="tablewrap"><table><thead><tr><th>Hole</th><th>Par</th><th>SI</th><th>Black</th><th>Blue</th><th>White</th><th>Red</th></tr></thead><tbody>
  ${r.slice(0, 9).map((h, i) => hr(h, i)).join('')}${line('Out', tot(0, 9))}
  ${r.slice(9).map((h, i) => hr(h, i + 9)).join('')}${line('In', tot(9, 18))}${line('Total', tot(0, 18))}
  </tbody></table></div>
  <div class="tablewrap"><table><thead><tr><th>Ratings (Oct 2025)</th><th>Course rating</th><th>Slope</th></tr></thead><tbody>
  <tr><td>Men · back tees (Black)</td><td>71.2</td><td>130</td></tr>
  <tr><td>Ladies · White</td><td>73.8</td><td>133</td></tr>
  <tr><td>Ladies · Red</td><td>70.6</td><td>122</td></tr>
  <tr><td>Men · Blue</td><td colspan="2" style="text-align:right">Not published yet. Ask the club.</td></tr>
  </tbody></table></div>
  <div class="src"><span>Sources: hole-by-hole card and GPS points from <a href="https://18birdies.com/golf-courses/club/9ade3470-ba14-11ee-abbd-06780482e2ce/jaypee-greens-wish-town" target="_blank" rel="noopener">18Birdies</a>; ratings from <a href="https://www.indiagolfweekly.com/features/jaypee-wishtown-noida-unveils-new-clubhouse/" target="_blank" rel="noopener">India Golf Weekly</a>; hazard outlines from <a href="https://www.openstreetmap.org/#map=18/28.5180/77.3620" target="_blank" rel="noopener">OpenStreetMap</a>. Check the card against the one in the pro shop before the match.</span></div>`;
}

// ---------- map ----------
const NS = 'http://www.w3.org/2000/svg';
function poly(pts) { return pts.map(([x, y]) => `${x},${-y}`).join(' '); }
function drawMap() {
  const t = tee(), pn = pin();
  let s = `<defs><clipPath id="clip"><rect x="-95" y="-360" width="190" height="380" rx="2"/></clipPath></defs><g clip-path="url(#clip)">
   <image href="${IMG}" x="-95" y="-360" width="190" height="380" preserveAspectRatio="none"/>
   <polygon points="${poly(H.fairway)}" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.55)" stroke-width=".5" stroke-dasharray="2 1.5"/>
   ${[H.treesLeft, H.treesClump, H.treesRight].map((p) => `<polygon points="${poly(p)}" fill="rgba(10,40,15,.25)" stroke="#9bd39b" stroke-width=".45" stroke-dasharray="1 1"/>`).join('')}
   ${['pond1', 'pond2'].map((k) => `<polygon points="${poly(OSM_GEOM[k])}" fill="rgba(90,166,240,.25)" stroke="#5AA6F0" stroke-width=".7"/>`).join('')}
   ${['bunkerFront', 'bunkerBack', 'bunkerRightGreen'].map((k) => `<polygon points="${poly(OSM_GEOM[k])}" fill="rgba(232,199,122,.25)" stroke="#E8C77A" stroke-width=".6"/>`).join('')}
   <polygon points="${poly(OSM_GEOM.green)}" fill="rgba(124,252,154,.15)" stroke="#7CFC9A" stroke-width=".7"/>
   <line x1="-85" y1="-110" x2="-85" y2="-360" stroke="#fff" stroke-width=".6" stroke-dasharray="3 2"/>
   <text x="-83" y="-140" font-size="5.5" fill="#fff" class="lbl" transform="rotate(-90 -83 -140)">OUT OF BOUNDS</text>`;
  // arcs
  for (const r of [100, 150, 200, 250]) {
    const a0 = -0.42, a1 = 0.42, base = Math.atan2(pn.x - t.x, pn.y - t.y);
    const p0 = [t.x + Math.sin(base + a0) * r, -(t.y + Math.cos(base + a0) * r)], p1 = [t.x + Math.sin(base + a1) * r, -(t.y + Math.cos(base + a1) * r)];
    s += `<path d="M${p0[0]},${p0[1]} A${r},${r} 0 0 1 ${p1[0]},${p1[1]}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width=".4"/>
      <text x="${p1[0] + 1.5}" y="${p1[1] + 1.5}" font-size="6" fill="#fff" class="lbl">${r}</text>`;
  }
  // plan
  if (R && !R.error) {
    const row = R.rows[pick];
    const aim = { x: t.x + Math.sin(row.ang) * row.total, y: t.y + Math.cos(row.ang) * row.total };
    for (const d of row.first.slice(0, 220)) s += `<circle class="dot" cx="${d.x}" cy="${-d.y}" r="1.1" fill="${LIECOL[d.lie]}" fill-opacity=".85"/>`;
    s += `<line x1="${t.x}" y1="${-t.y}" x2="${aim.x}" y2="${-aim.y}" stroke="#F2C230" stroke-width="1.2" stroke-dasharray="3 2"/>`;
    s += `<circle cx="${aim.x}" cy="${-aim.y}" r="3" fill="none" stroke="#F2C230" stroke-width="1"/>`;
    const sec = row.second;
    if (sec && !sec.short && sec.dots) {
      for (const d of sec.dots.slice(0, 160)) s += `<circle class="dot" cx="${d.x}" cy="${-d.y}" r=".9" fill="${LIECOL[d.lie]}" fill-opacity=".8"/>`;
      const a2 = { x: sec.x + Math.sin(sec.ang) * sec.carry, y: sec.y + Math.cos(sec.ang) * sec.carry };
      s += `<line x1="${sec.x}" y1="${-sec.y}" x2="${a2.x}" y2="${-a2.y}" stroke="#F2C230" stroke-width="1.2"/>`;
      s += `<circle cx="${sec.x}" cy="${-sec.y}" r="2.2" fill="#F2C230" stroke="#000" stroke-width=".4"/>`;
      s += `<text x="${sec.x + 4}" y="${-sec.y + 2}" font-size="6.5" fill="#fff" class="lbl">${yd(sec.d)} to pin</text>`;
    } else if (sec) {
      s += `<circle cx="${sec.x}" cy="${-sec.y}" r="2.2" fill="#F2C230" stroke="#000" stroke-width=".4"/>`;
    }
  }
  // tee + pin
  s += `<rect x="${t.x - 2.5}" y="${-t.y - 2.5}" width="5" height="5" fill="#fff" stroke="#000" stroke-width=".5"/>`;
  s += `<line x1="${pn.x}" y1="${-pn.y}" x2="${pn.x}" y2="${-pn.y - 11}" stroke="#fff" stroke-width=".8"/><polygon points="${pn.x},${-pn.y - 11} ${pn.x + 6},${-pn.y - 9} ${pn.x},${-pn.y - 7}" fill="#E8463A"/>`;
  s += `<text x="${t.x + 5}" y="${-t.y + 2}" font-size="6.5" fill="#fff" class="lbl">${cur().tee} tee · ${t.card}</text></g>`;
  s += `<style>.lbl{font-family:${'Archivo Narrow, Arial Narrow, sans-serif'};font-weight:600;paint-order:stroke;stroke:rgba(0,0,0,.75);stroke-width:1.4px;}</style>`;
  $('#map').innerHTML = s;
}

// ---------- boot ----------
renderHeader(); renderHazards(); renderCard(); renderBag(); showTab(); drawMap(); renderPlan(); run();
})();
</script>
